# decomp.wtf on a server (or any computer with Docker): docker compose up -d, then
#   docker compose exec decomp decomp url     the address that opens it (signed in)
# For a team room at your own address, also publish the room port (decomp share <project> --address ...).
services:
  decomp:
    build: .
    container_name: decomp-wtf
    restart: unless-stopped
    init: true
    environment:
      DECOMP_PORT: "6464"
    ports:
      - "127.0.0.1:6464:6464"
    volumes:
      # Persist projects and user database across container updates without shadowing application binaries:
      - decomp-wtf-projects:/home/decomp/Decomp
      - decomp-wtf-data:/home/decomp/.local/share/decompnet

volumes:
  decomp-wtf-projects:
  decomp-wtf-data:
